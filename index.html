<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路得記 - 希伯來文逐字語法自測 (含動詞高亮)</title>
    <link href="https://fonts.googleapis.com/css2?family=Ezra+SIL&family=Noto+Serif+Hebrew:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a73e8;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --border: #dadce0;
            --verb-color: #b91c1c;       /* 動詞文字深紅 */
            --verb-bg: #fef3c7;          /* 動詞底框淡金 */
            --verb-border: #f59e0b;      /* 動詞外框 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 16px;
            color: #202124;
        }

        .header-card {
            max-width: 1040px;
            margin: 0 auto 16px auto;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .title-area h1 { margin: 0 0 4px 0; font-size: 20px; }
        .title-area p { margin: 0; font-size: 13px; color: #5f6368; }

        .chapter-tabs { display: flex; gap: 8px; }
        .tab-btn {
            border: 1px solid var(--border);
            background: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .controls {
            max-width: 1040px;
            margin: 0 auto 16px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-group { display: flex; gap: 8px; align-items: center; }

        .btn {
            background: #fff;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        .btn:hover { background: #f1f3f4; }

        /* 動詞模式開關按鈕 */
        .btn-verb-toggle {
            background: #fff7ed;
            border-color: #fdba74;
            color: #c2410c;
        }
        .btn-verb-toggle.active {
            background: #ea580c;
            color: white;
            border-color: #ea580c;
        }

        .verse-select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 13px;
            background: #fff;
        }

        .main-container {
            max-width: 1040px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .verse-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border: 1px solid #e0e2e6;
        }

        .verse-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 12px;
            border-bottom: 1px solid #f1f3f4;
            padding-bottom: 4px;
        }

        .words-flex {
            display: flex;
            flex-direction: row-reverse;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start;
        }

        .word-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 82px;
            max-width: 140px;
            flex: 1 0 auto;
            cursor: pointer;
            position: relative;
        }

        /* 動詞小標籤（預設隱藏） */
        .verb-badge {
            display: none;
            font-size: 10px;
            font-weight: bold;
            color: #b91c1c;
            background: #fee2e2;
            padding: 1px 6px;
            border-radius: 8px;
            margin-bottom: 2px;
        }

        .hebrew-text {
            font-family: 'Ezra SIL', 'Noto Serif Hebrew', serif;
            font-size: 28px;
            line-height: 1.35;
            color: #111;
            padding: 4px 6px;
            border-radius: 6px;
            text-align: center;
            direction: rtl;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }

        .word-unit:hover .hebrew-text {
            background-color: #e8f0fe;
            color: var(--primary);
        }

        /* ========== 🔥 動詞高亮模式樣式 ========== */
        body.verb-highlight-on .word-unit.is-verb .hebrew-text {
            color: var(--verb-color) !important;
            background-color: var(--verb-bg);
            border-color: var(--verb-border);
            font-weight: bold;
            box-shadow: 0 1px 3px rgba(185, 28, 28, 0.15);
        }

        body.verb-highlight-on .word-unit.is-verb .verb-badge {
            display: inline-block;
        }

        /* 下方留白解析欄位 */
        .parsing-slot {
            margin-top: 6px;
            width: 100%;
            min-height: 95px;
            border: 1px dashed #c0c4cc;
            border-radius: 6px;
            background-color: #fbfcfd;
            padding: 6px 4px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .parsing-info { display: none; width: 100%; }

        .word-unit.revealed .hebrew-text {
            background-color: #e8f0fe !important;
            color: var(--primary) !important;
            border-color: transparent !important;
        }

        .word-unit.revealed .parsing-slot {
            border: 1px solid var(--primary);
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(26,115,232,0.1);
        }

        .word-unit.revealed .parsing-info { display: block; }

        .lemma-tag {
            font-family: 'Noto Serif Hebrew', serif;
            font-weight: bold;
            font-size: 13px;
            color: var(--primary);
            direction: rtl;
        }

        .morph-tag {
            font-size: 11px;
            color: #495057;
            margin: 3px 0;
            line-height: 1.25;
        }

        .gloss-tag {
            font-size: 12px;
            color: #c5221f;
            font-weight: 600;
        }
    </style>
</head>

<div class="header-card">

    </div>

    </div>
</div>

    </div>
    <div class="btn-group">

</div>

let currentChapter = 1;

// 🎯 自動辨識動詞（包含各大語態、不定詞與分詞）
function isVerbMorph(morphStr) {
    const verbKeys = [
        "Qal", "Nifal", "Piel", "Pual", "Hifil", "Hofal", "Hitpael", "Hishtafal",
        "完成", "未完成", "連續態", "祈使", "意願", "不定詞", "分詞"
    ];
    return verbKeys.some(key => morphStr.includes(key));
}

function switchChapter(chap) {
    currentChapter = chap;
    document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx + 1 === chap);
    });
    renderChapter();
}

function renderChapter() {
    const container = document.getElementById("content-container");
    const jumpSelect = document.getElementById("verseJump");
    container.innerHTML = "";
    jumpSelect.innerHTML = "";

    const list = BIBLE_BOOK[currentChapter] || [];

    list.forEach(vData => {
        const opt = document.createElement("option");
        opt.value = vData.v;
        opt.innerText = `第 ${vData.v} 節`;
        jumpSelect.appendChild(opt);

        const card = document.createElement("div");
        card.className = "verse-card";
        card.id = "v-" + vData.v.replace(":", "-");

        const title = document.createElement("div");
        title.className = "verse-title";
        title.innerText = `路得記 Ruth ${vData.v}`;
        card.appendChild(title);

        const wordsFlex = document.createElement("div");
        wordsFlex.className = "words-flex";

        vData.w.forEach(item => {
            const unit = document.createElement("div");
            unit.className = "word-unit";
            
            // 標記動詞
            const isVerb = isVerbMorph(item[2]);
            if (isVerb) unit.classList.add("is-verb");

            unit.onclick = () => unit.classList.toggle("revealed");

            unit.innerHTML = `
                ${isVerb ? '<span class="verb-badge">動詞 V</span>' : ''}
                <div class="hebrew-text">${item[0]}</div>
                <div class="parsing-slot">
                    <div class="parsing-info">
                        <div class="lemma-tag">${item[1]}</div>
                        <div class="morph-tag">${item[2]}</div>
                        <div class="gloss-tag">${item[3]}</div>
                    </div>
                </div>
            `;
            wordsFlex.appendChild(unit);
        });

        card.appendChild(wordsFlex);
        container.appendChild(card);
    });
}

function toggleVerbHighlight() {
    const body = document.body;
    const btn = document.getElementById("verbToggleBtn");
    body.classList.toggle("verb-highlight-on");
    const isOn = body.classList.contains("verb-highlight-on");
    btn.classList.toggle("active", isOn);
    btn.innerText = isOn ? "🎯 動詞醒目：開" : "🎯 動詞醒目：關";
}

function jumpToVerse(vStr) {
    const el = document.getElementById("v-" + vStr.replace(":", "-"));
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleAll(reveal) {
    document.querySelectorAll(".word-unit").forEach(u => {
        if (reveal) u.classList.add("revealed");
        else u.classList.remove("revealed");
    });
}

// 啟動渲染
renderChapter();
